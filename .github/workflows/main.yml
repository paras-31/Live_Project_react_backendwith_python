name: Deploy Frontend & Backend to Private EC2

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH keys
        env:
          PUBLIC_SERVER: ${{ secrets.PUBLIC_SERVER }}
          PRIVATE_SERVER: ${{ secrets.PRIVATE_SERVER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$PUBLIC_SERVER" | sed 's/\\n/\n/g' > ~/.ssh/public-server.pem
          echo "$PRIVATE_SERVER" | sed 's/\\n/\n/g' > ~/.ssh/private-server.pem
          chmod 600 ~/.ssh/public-server.pem ~/.ssh/private-server.pem

      - name: Add public EC2 to known hosts
        run: |
          ssh-keyscan -H ec2-44-220-83-30.compute-1.amazonaws.com >> ~/.ssh/known_hosts

      - name: Setup SSH config for ProxyJump
        run: |
          cat > ~/.ssh/config << 'SSHCONFIG'
          Host public-ec2
            HostName ec2-44-220-83-30.compute-1.amazonaws.com
            User ec2-user
            IdentityFile ~/.ssh/public-server.pem
            StrictHostKeyChecking no

          Host private-ec2
            HostName 10.0.142.57
            User ec2-user
            IdentityFile ~/.ssh/private-server.pem
            ProxyJump public-ec2
            StrictHostKeyChecking no
          SSHCONFIG
          chmod 600 ~/.ssh/config

      - name: Add private EC2 to known hosts via jump
        run: |
          ssh-keyscan -H 10.0.142.57 -p 22 | ssh public-ec2 'cat >> ~/.ssh/known_hosts' || true
          ssh -J public-ec2 -o StrictHostKeyChecking=no ec2-user@10.0.142.57 "echo '✅ Connected to private EC2'"

      - name: Pull latest code on private EC2
        run: |
          ssh private-ec2 << 'ENDSSH'
            set -e
            echo "📂 Navigating to project..."
            cd /home/ec2-user/Live_Project_react_backendwith_python
            echo "📥 Pulling latest code..."
            git pull origin main
            echo "✅ Code updated"
          ENDSSH

      - name: Build & Run Frontend Docker
        run: |
          ssh private-ec2 << 'ENDSSH'
            set -e
            echo "🚀 Building Frontend..."
            cd /home/ec2-user/Live_Project_react_backendwith_python/Live-project-forntend_Docker
            docker build -t frontend-app .
            docker stop frontend || true
            docker rm frontend || true
            docker run -d --name frontend -p 3000:3000 frontend-app
            echo "✅ Frontend running"
          ENDSSH

      - name: Build & Run Backend Docker
        run: |
          ssh private-ec2 << 'ENDSSH'
            set -e
            echo "🚀 Building Backend..."
            cd /home/ec2-user/Live_Project_react_backendwith_python/Live-project-backend_pyhton_doc
            docker build -t backend-app .
            docker stop backend || true
            docker rm backend || true
            docker run -d --name backend -p 8000:8000 backend-app
            echo "✅ Backend running"
          ENDSSH

      - name: Verify containers running
        run: |
          ssh private-ec2 "docker ps"