name: Deploy Frontend & Backend to Private EC2

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH keys
        env:
          PUBLIC_SERVER: ${{ secrets.PUBLIC_SERVER }}
          PRIVATE_SERVER: ${{ secrets.PRIVATE_SERVER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$PUBLIC_SERVER" | sed 's/\\n/\n/g' > ~/.ssh/public-server.pem
          echo "$PRIVATE_SERVER" | sed 's/\\n/\n/g' > ~/.ssh/private-server.pem
          chmod 600 ~/.ssh/public-server.pem ~/.ssh/private-server.pem

      - name: Add public EC2 to known hosts
        run: |
          ssh-keyscan -H ec2-44-220-83-30.compute-1.amazonaws.com >> ~/.ssh/known_hosts

      - name: Deploy to private EC2 via ProxyJump
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ProxyCommand="ssh -o StrictHostKeyChecking=no -i ~/.ssh/public-server.pem -W %h:%p ec2-user@ec2-44-220-83-30.compute-1.amazonaws.com" \
              -i ~/.ssh/private-server.pem \
              ec2-user@10.0.142.57 << 'ENDSSH'
            set -e
            echo "✅ Connected to private EC2"
            echo "Hostname: $(hostname)"

            echo "📥 Pulling latest code..."
            cd /home/ec2-user/Live_Project_react_backendwith_python
            git pull origin main

            echo "🚀 Building Frontend..."
            cd /home/ec2-user/Live_Project_react_backendwith_python/Live-project-forntend_Docker
            docker stop frontend || true
            docker rm frontend || true
            if docker image inspect frontend-app >/dev/null 2>&1; then docker rmi frontend-app; fi
            docker build -t frontend-app .
            docker run -d --name frontend -p 80:80 frontend-app
            echo "✅ Frontend running"

            echo "🚀 Building Backend..."
            cd /home/ec2-user/Live_Project_react_backendwith_python/Live-project-backend_pyhton_docker
            docker stop backend || true
            docker rm backend || true
            if docker image inspect backend-app >/dev/null 2>&1; then docker rmi backend-app; fi
            docker build -t backend-app .
            docker run -d --name backend -p 8000:8000 backend-app
            echo "✅ Backend running"

            echo "🐳 Running containers:"
            docker ps
          ENDSSH