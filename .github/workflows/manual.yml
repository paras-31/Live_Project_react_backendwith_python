# Deploy to private EC2 via public EC2 (jump host) on push to main
# Flow: Runner -> SSH to public EC2 -> SCP key/code to private EC2 -> all docker runs on private EC2 only

name: Deploy to Private EC2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      name:
        description: 'Person to greet (manual run)'
        default: 'World'
        required: true
        type: string

env:
  PUBLIC_EC2: ec2-user@ec2-44-220-83-30.compute-1.amazonaws.com
  PRIVATE_EC2_IP: 10.0.142.57
  ALB_DNS: applb-721266216.us-east-1.elb.amazonaws.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create SSH key files from secrets
        run: |
          echo '${{ secrets.PUBLIC_SERVER }}' > public-server.pem
          echo '${{ secrets.PRIVATE_SERVER }}' > private-server.pem
          chmod 600 public-server.pem private-server.pem

      - name: Add public EC2 to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ec2-44-220-83-30.compute-1.amazonaws.com >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy private-server.pem to public EC2
        run: |
          scp -i public-server.pem -o StrictHostKeyChecking=no \
            private-server.pem "$PUBLIC_EC2":~/

      - name: Copy frontend and backend code to public EC2
        run: |
          scp -i public-server.pem -o StrictHostKeyChecking=no -r \
            Live-project-forntend_Docker \
            Live-project-backend_pyhton_docker \
            "$PUBLIC_EC2":~/

      - name: From public EC2 – add private EC2 to known_hosts and SCP private-server.pem to private EC2
        run: |
          ssh -i public-server.pem -o StrictHostKeyChecking=no "$PUBLIC_EC2" \
            "ssh-keyscan -H $PRIVATE_EC2_IP >> ~/.ssh/known_hosts 2>/dev/null || true"
          ssh -i public-server.pem -o StrictHostKeyChecking=no "$PUBLIC_EC2" \
            "scp -i private-server.pem -o StrictHostKeyChecking=no private-server.pem ec2-user@$PRIVATE_EC2_IP:~/"

      - name: From public EC2 – SCP frontend and backend code to private EC2
        run: |
          ssh -i public-server.pem -o StrictHostKeyChecking=no "$PUBLIC_EC2" \
            "scp -i private-server.pem -o StrictHostKeyChecking=no -r \
              Live-project-forntend_Docker \
              Live-project-backend_pyhton_docker \
              ec2-user@$PRIVATE_EC2_IP:~/"

      - name: On private EC2 – build and run backend (no commands run on public EC2)
        run: |
          ssh -i public-server.pem -o StrictHostKeyChecking=no "$PUBLIC_EC2" \
            "ssh -i private-server.pem -o StrictHostKeyChecking=no ec2-user@$PRIVATE_EC2_IP" \
            'cd Live-project-backend_pyhton_docker && \
             docker build -t live-backend . && \
             docker stop live-backend 2>/dev/null || true; \
             docker rm live-backend 2>/dev/null || true; \
             docker run -d -p 8000:8000 \
               -e CORS_ORIGINS="http://'"$ALB_DNS"',https://'"$ALB_DNS"'" \
               --name live-backend live-backend'

      - name: On private EC2 – build and run frontend (no commands run on public EC2)
        run: |
          ssh -i public-server.pem -o StrictHostKeyChecking=no "$PUBLIC_EC2" \
            "ssh -i private-server.pem -o StrictHostKeyChecking=no ec2-user@$PRIVATE_EC2_IP" \
            'cd Live-project-forntend_Docker && \
             docker build --build-arg VITE_API_URL=http://'"$ALB_DNS"':8000 -t live-frontend . && \
             docker stop live-frontend 2>/dev/null || true; \
             docker rm live-frontend 2>/dev/null || true; \
             docker run -d -p 80:80 --name live-frontend live-frontend'
