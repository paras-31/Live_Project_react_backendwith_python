name: SCP private-server.pem to Public EC2

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  scp-pem:
    runs-on: ubuntu-latest
    environment: public-server.pem

    steps:
      - name: Setup SSH keys
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write public-server.pem (auth key)
          printf '%s\n' "${{ secrets.PUBLIC_SERVER }}" > public-server.pem
          chmod 700 public-server.pem

          # Write private-server.pem (file to copy)
          printf '%s\n' "${{ secrets.PRIVATE_SERVER }}" > private-server.pem
          chmod 700 private-server.pem

          # Validate the auth key
          ssh-keygen -l -f public-server.pem

      - name: Add EC2 to known hosts
        run: |
          ssh-keyscan -H ec2-44-220-83-30.compute-1.amazonaws.com >> ~/.ssh/known_hosts

      - name: SCP private-server.pem to EC2
        run: |
          scp -i public-server.pem private-server.pem ec2-user@ec2-44-220-83-30.compute-1.amazonaws.com:~/

      - name: Verify file copied
        run: |
          ssh -i public-server.pem ec2-user@ec2-44-220-83-30.compute-1.amazonaws.com "ls -la ~/private-server.pem"