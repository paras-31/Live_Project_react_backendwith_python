# Frontend behind ALB: ALB forwards to this container on EC2:80.
# server_name _ accepts requests with any Host (ALB DNS, IP, or localhost).
# /api is proxied to the backend (same host, port 8000) so the frontend can use relative URLs.
server {
    listen 80;
    server_name _;

    # Proxy API calls to backend. Same host: use host gateway (default bridge 172.17.0.1).
    # If backend is elsewhere, set VITE_API_URL at frontend build time instead.
    location /api/ {
        proxy_pass http://172.17.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept";
    }
}
